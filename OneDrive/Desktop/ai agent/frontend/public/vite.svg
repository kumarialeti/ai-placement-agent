<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8B5CF6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3B82F6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#EC4899;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8B5CF6;stop-opacity:1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background Glow -->
  <circle cx="50" cy="50" r="35" fill="url(#grad1)" opacity="0.15" filter="url(#glow)" />
  
  <!-- Outer Ring -->
  <circle cx="50" cy="50" r="40" fill="none" stroke="url(#grad1)" stroke-width="3" stroke-dasharray="8 4" opacity="0.6" />

  <!-- Brain/AI Node Core -->
  <path d="M50 20 L75 40 L65 75 L35 75 L25 40 Z" fill="none" stroke="url(#grad2)" stroke-width="4" stroke-linejoin="round" />
  
  <!-- Central Pulse -->
  <circle cx="50" cy="50" r="10" fill="url(#grad1)" filter="url(#glow)" />
  
  <!-- Connections -->
  <line x1="50" y1="20" x2="50" y2="40" stroke="#FFF" stroke-width="2" opacity="0.8" />
  <line x1="25" y1="40" x2="40" y2="48" stroke="#FFF" stroke-width="2" opacity="0.8" />
  <line x1="75" y1="40" x2="60" y2="48" stroke="#FFF" stroke-width="2" opacity="0.8" />
  <line x1="35" y1="75" x2="45" y2="60" stroke="#FFF" stroke-width="2" opacity="0.8" />
  <line x1="65" y1="75" x2="55" y2="60" stroke="#FFF" stroke-width="2" opacity="0.8" />

  <!-- Node points -->
  <circle cx="50" cy="20" r="4" fill="#FFF" />
  <circle cx="25" cy="40" r="4" fill="#FFF" />
  <circle cx="75" cy="40" r="4" fill="#FFF" />
  <circle cx="35" cy="75" r="4" fill="#FFF" />
  <circle cx="65" cy="75" r="4" fill="#FFF" />
</svg>
